<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 34" width="34" height="34" role="img" aria-label="Nonconformity">
  <!-- currentColor takes whatever color the surrounding context sets, so
       this is the version to drop inline next to text or into a badge
       that already controls its own color. -->
  <path d="M2 22 L8 22 L11 10 L15 28 L19 6 L22 22 L32 22"
        fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
